<!DOCTYPE html>
<html> 
    <head>
        <link rel="stylesheet" href="elk.css">
        <!--<meta name="viewport" content="width=device-width, initial-scale=1.0">-->
        <script src="elk_project.js"></script>
       
    </head>
    <body>
        <div class="layout">
            <aside class="left-panel">
              <h2>Выберите ёлку</h2>
              <div class="tree-grid">
                <img src="./images/elka.png" width="100" height="100" />
                <img src="./images/elka1.png" width="100" height="100"/> 
            </div>
        
              <h2>Выберите фон</h2>
              <div class="bg-grid"></div>
        
              <h2>Гирлянда</h2>
              <div class="garland-grid"> 
                
              </div>
        
              <div class="buttons">
                <a class="button" id="save-tree-btn">Сохранить</a>
                <a class="button"id="reset-tree-btn">Сбросить настройки</a>
              </div>
            </aside>
            <main class="tree-area">
              <img src="./images/elka.png" class="main-tree" />
            </main>
            <aside class="right-panel">
              <h2>Игрушки</h2>
              <div class="toy" data-type="ball" data-size="big"></div>
              <div class="toys-grid"></div>
            </aside>
        </div>
    </body>
</html>
